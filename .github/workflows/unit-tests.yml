name: Unit tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  cache: true

            - name: Run tests
              run: pnpm run test
